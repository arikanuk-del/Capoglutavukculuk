<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donmuş Ürünler · Dağıtım Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --ink:#10262B; --ink-2:#31474C;
  --petrol:#0E6E77; --petrol-d:#0A555C; --petrol-l:#E4F0F0;
  --frost:#EEF3F3; --surface:#FFFFFF; --line:#DBE7E7;
  --muted:#5F7378;
  --fresh:#1E9E6A; --fresh-l:#E4F4EC;
  --alert:#D9553F; --alert-l:#FADFDA;
  --amber:#C9871F; --amber-l:#F8EED5;
  --radius:14px; --shadow:0 1px 2px rgba(16,38,43,.04);
}

/* ---------- Gece modu (varsayılan: cihaz ayarı; düğme geçersiz kılar) ---------- */
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#E7EFEF; --ink-2:#B4C6C8;
  --petrol:#0F818C; --petrol-d:#0C6A73; --petrol-l:#123A40;
  --frost:#0C1A1E; --surface:#122A30; --line:#264449;
  --muted:#8CA3A6;
  --fresh:#37B884; --fresh-l:#123A30;
  --alert:#E96A54; --alert-l:#3A211C;
  --amber:#D8A24A; --amber-l:#33291A;
}
:root[data-theme="dark"] .nav-item.active,
:root[data-theme="dark"] .seg button.on,
:root[data-theme="dark"] .b-neu,
:root[data-theme="dark"] .aic.buy{color:#6FD0D8}
:root[data-theme="dark"] .b-ok,
:root[data-theme="dark"] .aic.in,
:root[data-theme="dark"] .intake-badge{background:rgba(55,184,132,.15);color:#5FCE9B}
:root[data-theme="dark"] .b-warn{background:rgba(216,162,74,.16);color:#E4B45E}
:root[data-theme="dark"] .b-bad,
:root[data-theme="dark"] .aic.out,
:root[data-theme="dark"] .item-row .rm{background:rgba(233,106,84,.16);color:#F28E78}
:root[data-theme="dark"] .b-mut,
:root[data-theme="dark"] kbd{background:#20383E;color:var(--muted)}
:root[data-theme="dark"] th,
:root[data-theme="dark"] .item-head,
:root[data-theme="dark"] .item-add{background:#152C32}
:root[data-theme="dark"] td,
:root[data-theme="dark"] .arow,
:root[data-theme="dark"] .crit,
:root[data-theme="dark"] .item-row,
:root[data-theme="dark"] .intake-item{border-bottom-color:#223A40}
:root[data-theme="dark"] tbody tr:hover{background:#163036}
:root[data-theme="dark"] .topbar{background:rgba(12,26,30,.86)}
:root[data-theme="dark"] .btn-ghost:hover{background:#163036;border-color:#33585E}
:root[data-theme="dark"] .icon-btn:hover{border-color:#33585E}
:root[data-theme="dark"] .toast{background:#20383E}
:root[data-theme="dark"] .login{background:radial-gradient(1100px 560px at 50% -10%,#123037,var(--frost))}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Manrope',system-ui,sans-serif;
  background:var(--frost); color:var(--ink);
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 0;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mono-n{font-variant-numeric:tabular-nums}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
.sidebar{
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px}
.brand .mark{
  width:38px;height:38px;border-radius:11px;flex:none;
  background:linear-gradient(150deg,var(--petrol),#0B838C);
  display:grid;place-items:center;color:#fff;box-shadow:0 3px 8px rgba(14,110,119,.28)
}
.brand .mark svg{width:21px;height:21px}
.brand b{font-size:15px;font-weight:800;letter-spacing:-.2px;line-height:1.15;display:block}
.brand span{font-size:11.5px;color:var(--muted);font-weight:600}
nav{padding:6px 12px;overflow-y:auto;flex:1}
.nav-lbl{font-size:11px;font-weight:700;color:var(--muted);padding:12px 10px 6px;letter-spacing:.02em}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 11px;border:0;background:transparent;border-radius:10px;
  color:var(--ink-2);font-size:13.5px;font-weight:600;margin-bottom:1px;
}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.85}
.nav-item:hover{background:var(--petrol-l)}
.nav-item.active{background:var(--petrol-l);color:var(--petrol-d);font-weight:700}
.nav-item.active svg{opacity:1}
.side-foot{padding:14px 16px;border-top:1px solid var(--line)}
.mode-chip{
  display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;
  color:var(--amber);background:var(--amber-l);padding:8px 11px;border-radius:9px;
}
.mode-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none}
.side-foot small{display:block;color:var(--muted);font-size:10.5px;margin-top:8px;line-height:1.45;font-weight:500}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 24px;height:62px;
}
.hamb{display:none;border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:10px}
.hamb svg{width:19px;height:19px}
.page-title{font-size:18px;font-weight:800;letter-spacing:-.3px}
.topbar .spacer{flex:1}
.today{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.view{padding:22px 24px 40px;max-width:1280px;width:100%}

/* ---------- Buttons ---------- */
.btn{border:1px solid transparent;border-radius:10px;padding:9px 15px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px;line-height:1;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--petrol);color:#fff}
.btn-primary:hover{background:var(--petrol-d)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink-2)}
.btn-ghost:hover{border-color:#c3d3d3;background:#fbfdfd}
.btn-danger{background:var(--alert);color:#fff}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--petrol);border-color:#c3d3d3}
.icon-btn svg{width:15px;height:15px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:13px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px 15px 18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--petrol)}
.kpi.k-fresh::before{background:var(--fresh)}
.kpi.k-alert::before{background:var(--alert)}
.kpi.k-amber::before{background:var(--amber)}
.kpi.k-ink::before{background:var(--ink)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px}
.kpi .val{font-size:25px;font-weight:800;letter-spacing:-.5px;line-height:1}
.kpi .sub{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:7px}
.kpi .sub b{color:var(--ink-2)}

/* ---------- Panels ---------- */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.panel-h h3{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.panel-h .sub{font-size:12px;color:var(--muted);font-weight:600}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:180px;max-width:340px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--petrol);box-shadow:0 0 0 3px var(--petrol-l)}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--petrol-l);color:var(--petrol-d)}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafcfc}
td{padding:12px 14px;border-bottom:1px solid #eef4f4;font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f7fbfb}
th.r,td.r{text-align:right}
.t-name{font-weight:700;color:var(--ink)}
.t-sub{font-size:11.5px;color:var(--muted);font-weight:500}
.row-act{display:flex;gap:6px;justify-content:flex-end}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--fresh-l);color:#157A50}
.b-warn{background:var(--amber-l);color:#946213}
.b-bad{background:var(--alert-l);color:#B23A26}
.b-neu{background:var(--petrol-l);color:var(--petrol-d)}
.b-mut{background:#eef2f2;color:var(--muted)}
.dot-b{width:6px;height:6px;border-radius:50%;background:currentColor}
.pos{color:var(--fresh);font-weight:700}
.neg{color:var(--alert);font-weight:700}

/* ---------- Charts ---------- */
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.bar-fill{width:100%;max-width:46px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#1f97a0,var(--petrol));min-height:4px;transition:height .5s ease}
.bar-x{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.bar-v{font-size:11px;font-weight:700;color:var(--ink-2)}
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar .hb-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.hbar .hb-top b{font-weight:700}.hbar .hb-top span{color:var(--muted);font-weight:600}
.hb-track{height:8px;background:var(--frost);border-radius:999px;overflow:hidden}
.hb-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--petrol),#2aa7b0)}

/* ---------- Activity / lists ---------- */
.alist{display:flex;flex-direction:column}
.arow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #eef4f4}
.arow:last-child{border-bottom:0}
.aic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.aic svg{width:16px;height:16px}
.aic.in{background:var(--fresh-l);color:#157A50}
.aic.out{background:var(--alert-l);color:#B23A26}
.aic.buy{background:var(--petrol-l);color:var(--petrol-d)}
.arow .at{flex:1;min-width:0}
.arow .at b{font-weight:700;font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .at span{font-size:11.5px;color:var(--muted);font-weight:500}
.arow .av{font-weight:800;font-size:14px;white-space:nowrap}

/* critical list */
.crit{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eef4f4}
.crit:last-child{border-bottom:0}
.crit .cn{font-weight:700;font-size:13.5px}
.crit .cc{font-size:11.5px;color:var(--muted);font-weight:500}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty svg{width:34px;height:34px;opacity:.5;margin-bottom:12px}
.empty b{display:block;color:var(--ink-2);font-size:14.5px;margin-bottom:5px;font-weight:700}
.empty p{margin:0 0 16px;font-size:13px}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(16,38,43,.46);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .16s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(16,38,43,.24);transform:translateY(8px);transition:transform .18s}
.overlay.show .modal{transform:none}
.modal.wide{max-width:720px}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.m-head h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.2px}
.m-body{padding:20px 22px;max-height:66vh;overflow-y:auto}
.m-foot{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;color:var(--ink-2)}
.field input,.field select,.field textarea{
  padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);width:100%
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--petrol);box-shadow:0 0 0 3px var(--petrol-l)}
.field .hint{font-size:11px;color:var(--muted);font-weight:500}

/* items editor */
.items-box{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.item-row{display:grid;grid-template-columns:1fr 74px 90px 90px 32px;gap:8px;align-items:center;padding:9px 10px;border-bottom:1px solid #eef4f4}
.item-row:last-child{border-bottom:0}
.item-row select,.item-row input{padding:7px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;width:100%}
.item-row .lt{font-size:12.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.item-row .rm{border:0;background:var(--alert-l);color:#B23A26;width:28px;height:28px;border-radius:7px;font-weight:800;font-size:15px;line-height:1}
.item-head{display:grid;grid-template-columns:1fr 74px 90px 90px 32px;gap:8px;padding:8px 10px;background:#fafcfc;font-size:10.5px;font-weight:700;color:var(--muted)}
.item-add{padding:9px 10px;background:#fafcfc}
.item-total{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--petrol-l);border-radius:10px;margin-top:12px;font-weight:800}
.item-total .tv{font-size:18px}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:11px;font-weight:700;font-size:13.5px;z-index:200;opacity:0;pointer-events:none;transition:all .22s;box-shadow:0 10px 30px rgba(16,38,43,.3);display:flex;align-items:center;gap:9px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:17px;height:17px;color:var(--fresh)}

/* ---------- Barcode scanner ---------- */
.scan-ov{position:fixed;inset:0;background:#000;z-index:300;display:none;flex-direction:column}
.scan-ov.show{display:flex}
.scan-video{flex:1;width:100%;height:100%;object-fit:cover;background:#000}
.scan-frame{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);width:76%;max-width:340px;aspect-ratio:1.55;border:2px solid rgba(255,255,255,.92);border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5);pointer-events:none}
.scan-line{position:absolute;left:8px;right:8px;height:2px;background:var(--fresh);box-shadow:0 0 8px var(--fresh);animation:scanmove 1.7s ease-in-out infinite}
@keyframes scanmove{0%,100%{top:14%}50%{top:86%}}
.scan-top{position:absolute;top:0;left:0;right:0;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;color:#fff;z-index:4}
.scan-top b{font-weight:800;font-size:16px}
.scan-hint{position:absolute;top:calc(44% + 130px);left:0;right:0;text-align:center;color:#fff;font-size:13.5px;font-weight:600;opacity:.92;z-index:4;padding:0 20px}
.scan-bot{position:absolute;bottom:26px;left:0;right:0;display:flex;justify-content:center;z-index:4}
.scan-btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);color:#fff;padding:11px 20px;border-radius:12px;font-weight:700;font-size:14px;font-family:inherit}
.scan-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 18px 26px;z-index:6;transform:translateY(115%);transition:transform .22s;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
.scan-sheet.show{transform:none}
.sheet-name{font-size:16px;font-weight:800;letter-spacing:-.2px}
.sheet-select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--surface);color:var(--ink)}
.sheet-btns{display:flex;gap:10px;margin-top:12px}
.big-qty{display:flex;align-items:center;gap:12px;justify-content:center;margin:14px 0 4px}
.big-qty button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:700;color:var(--petrol);line-height:1}
.big-qty input{width:96px;text-align:center;font-size:26px;font-weight:800;border:1px solid var(--line);border-radius:12px;padding:9px;font-variant-numeric:tabular-nums;color:var(--ink)}
.intake-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eef4f4;font-size:13.5px}
.intake-item:last-child{border-bottom:0}
.intake-badge{background:var(--fresh-l);color:#157A50;font-weight:800;border-radius:8px;padding:2px 10px;font-size:12.5px}
.mf-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.mf-row:last-child{border-bottom:0}
.mf-info{flex:1;min-width:0}
.mf-info b{font-weight:700;font-size:13.5px;display:block}
.mf-info span{font-size:11.5px;color:var(--muted)}
.mf-in{width:112px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-align:right;font-variant-numeric:tabular-nums;background:var(--surface);color:var(--ink)}
.mf-in:focus{outline:none;border-color:var(--petrol);box-shadow:0 0 0 3px var(--petrol-l)}

.backdrop{display:none}
kbd{background:#eef2f2;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700;font-family:inherit;color:var(--ink-2)}

/* ---------- Auth / boot ---------- */
.boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--frost);color:var(--muted);font-weight:600;z-index:400}
.boot-mark{font-size:34px}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--petrol);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1100px 560px at 50% -10%,#E4F0F0,var(--frost));z-index:400}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 26px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(16,38,43,.12)}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login-brand .mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(150deg,var(--petrol),#0B838C);display:grid;place-items:center;color:#fff;flex:none}
.login-brand .mark svg{width:24px;height:24px}
.login-brand b{font-size:16px;font-weight:800;display:block;letter-spacing:-.2px}
.login-brand span{font-size:12px;color:var(--muted);font-weight:600}
.login-field{margin-bottom:14px}

// Tüm satırları sayfalayarak çek (1000 satır sınırına karşı: gelen satır kadar ilerle, boşta dur)
async function fetchAll(table){
  const out=[]; const size=1000; let from=0;
  while(true){
    const {data,error}=await sb.from(table).select('*').range(from,from+size-1);
    if(error)throw error;
    out.push(...data);
    if(data.length<size)break;
    from+=data.length;
  }
  return out;
}
async function loadAll(){
  const keys=Object.keys(T);
  await Promise.all(keys.map(async k=>{
    try{ DB[k]=await fetchAll(T[k]); }
    catch(e){ console.warn('Yüklenemedi:',T[k],e); DB[k]=DB[k]||[]; }
  }));
}
// Yazmalar (iyimser: bellek zaten güncellendi; hata olursa uyarır)
function put(key,row){ if(!row)return; sb.from(T[key]).upsert(row).then(({error})=>{if(error)writeErr(error);}); }
function putMany(key,rows){ if(!rows||!rows.length)return; sb.from(T[key]).upsert(rows).then(({error})=>{if(error)writeErr(error);}); }
function del(key,id){ sb.from(T[key]).delete().eq('id',id).then(({error})=>{if(error)writeErr(error);}); }
function delByRef(key,ref){ sb.from(T[key]).delete().eq('ref',ref).then(({error})=>{if(error)writeErr(error);}); }
function writeErr(e){ console.error('Supabase yazma hatası:',e); toast('Kaydedilemedi — bağlantıyı kontrol edin'); }

async function initAuth(){
  wireLogin();
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session) await enterApp(session); else showLogin();
  }catch(e){ console.error(e); showLogin(); }
}
function showLogin(){
  document.getElementById('bootScreen').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('app').style.display='none';
}
async function enterApp(session){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('bootScreen').style.display='flex';
  try{ await loadAll(); }
  catch(e){ console.error(e); document.getElementById('bootScreen').innerHTML='<div style="text-align:center;color:var(--alert);font-weight:700;padding:0 24px">Veriler yüklenemedi.<br>Bağlantıyı kontrol edip sayfayı yenileyin.</div>'; return; }
  const ue=document.getElementById('userEmail'); if(ue)ue.textContent=session.user?.email||'';
  document.getElementById('bootScreen').style.display='none';
  document.getElementById('app').style.display='grid';
  buildNav(); render();
}
function wireLogin(){
  const f=document.getElementById('loginForm'); if(!f||f._wired)return; f._wired=true;
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const email=document.getElementById('lg_email').value.trim();
    const pass=document.getElementById('lg_pass').value;
    const err=document.getElementById('lg_err'); err.textContent='';
    const btn=document.getElementById('lg_btn'); btn.disabled=true; btn.textContent='Giriş yapılıyor…';
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    btn.disabled=false; btn.textContent='Giriş yap';
    if(error){ err.textContent='Giriş başarısız — e-posta veya şifre hatalı.'; return; }
    await enterApp(data.session);
  });
}
async function logout(){ try{await sb.auth.signOut();}catch(_){} location.reload(); }

function cariBakiye(cId){
  const m=musteri(cId); if(!m)return 0;
  let b=m.acilis||0;
  DB.cariHar.filter(h=>h.musteriId===cId).forEach(h=>{ b+= h.tip==='borc'?h.tutar:-h.tutar; });
  return b;
}
function stokDegeri(){ return DB.urunler.reduce((s,u)=>s+u.stok*u.alis,0); }
// Müşteriye göre fiyat: özel fiyat > liste × iskonto > liste
function fiyatBul(musteriId,urunId){
  const u=urun(urunId); if(!u)return 0;
  const oz=DB.musteriFiyat.find(x=>x.musteriId===musteriId&&x.urunId===urunId);
  if(oz)return oz.fiyat;
  const m=musteri(musteriId); const isk=m&&m.iskonto?m.iskonto:0;
  return Math.round(u.satis*(1-isk/100)*100)/100;
}
function kritikler(){ return DB.urunler.filter(u=>u.stok<=u.kritik); }
function cogs(sale){ return sale.kalemler.reduce((s,k)=>{const u=urun(k.urunId);return s+(u?u.alis:0)*k.miktar;},0); }

function buildNav(){

  VIEWS.forEach(v=>{

    h+=`<button class="nav-item${v.id===current?' active':''}" onclick="go('${v.id}')">${svg(I[v.ic],18)}<span>${v.t}</span></button>`;
  });
  $('#nav').innerHTML=h;
}
function toggleNav(o){ $('#sidebar').classList.toggle('open',o); $('#backdrop').classList.toggle('show',o); }
function go(id){ current=id; buildNav(); toggleNav(false); render(); window.scrollTo(0,0); }

  const ayCogs=DB.satislar.filter(s=>thisMonth(s.tarih)).reduce((a,s)=>a+cogs(s),0);

  DB.alimlar.forEach(a=>acts.push({d:a.tarih,type:'buy',title:a.tedarikci,sub:'Alım · '+a.kalemler.length+' kalem',val:TL0(a.toplam)}));

  $('#view').innerHTML=`

    ${kpi('k-fresh','Bugünkü satış',TL0(bugunSatis),`Bugünkü tahsilat: <b>${TL0(bugunTahsilat)}</b>`)}
    ${kpi('k-alert','Toplam açık alacak',TL0(acikAlacak),`${DB.musteriler.filter(c=>cariBakiye(c.id)>0).length} müşteride bakiye`)}
    ${kpi('k-amber','Kritik stok',NUM(krit.length)+' ürün',krit.length?'Sipariş edilmeli':'Stok seviyesi iyi')}

  </div>

    ${kpi('','Bu ay ciro',TL0(ayCiro))}
    ${kpi('','Bu ay gider',TL0(ayGider))}
    ${kpi('k-fresh','Bu ay brüt kâr',TL0(brut),'Satış − mal maliyeti')}
    ${kpi(net>=0?'k-fresh':'k-alert','Bu ay net kâr',TL0(net),'Brüt kâr − giderler')}
  </div>

  <div class="grid-3">
    <div class="panel">
      <div class="panel-h"><h3>Aylık satış trendi</h3><span class="sub">Son 6 ay</span></div>
      ${trendChart()}
    </div>
    <div class="panel">
      <div class="panel-h"><h3>Kritik stok</h3><span class="sub">${krit.length} ürün</span></div>
      ${krit.length? krit.slice(0,7).map(u=>`<div class="crit"><div><div class="cn">${esc(u.ad)}</div><div class="cc">${u.kategori}</div></div><span class="badge b-bad">${NUM(u.stok)} ${u.birim}</span></div>`).join('')
        : `<div class="empty" style="padding:24px"><b>Kritik stok yok</b><p>Tüm ürünler eşik seviyesinin üzerinde.</p></div>`}
    </div>

      ${(()=>{const list=DB.musteriler.map(c=>({c,b:cariBakiye(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b);
        return list.length? list.map(x=>`<div class="crit"><div><div class="cn">${esc(x.c.unvan)}</div><div class="cc">${x.c.tip}</div></div><span class="neg">${TL0(x.b)}</span></div>`).join('')

          <div class="av ${a.type==='in'?'pos':a.type==='out'?'neg':''}">${a.val}</div>
        </div>`).join('')}

    </div>

}

function trendChart(){
  const now=new Date(), months=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({y:d.getFullYear(),m:d.getMonth(),lbl:d.toLocaleDateString('tr-TR',{month:'short'}),v:0});}
  DB.satislar.forEach(s=>{const d=new Date(s.tarih);const mm=months.find(x=>x.y===d.getFullYear()&&x.m===d.getMonth());if(mm)mm.v+=s.toplam;});
  const max=Math.max(...months.map(m=>m.v),1);
  return `<div class="bars">${months.map(m=>`<div class="bar-col">
    <div class="bar-v">${m.v?TL0(m.v).replace(' ₺','')+'₺':''}</div>
    <div class="bar-fill" style="height:${Math.max(m.v/max*100,2)}%"></div>
    <div class="bar-x">${m.lbl}</div></div>`).join('')}</div>`;
}

  const body=`

    <div class="search" style="max-width:none;margin-bottom:10px">${svg(I.search,16)}<input id="mf_q" placeholder="Ürün ara..." oninput="mfQ=this.value;mfRender()"></div>
    <div id="mfList"></div>`;
  openModal('Özel fiyatlar',body,mfSave,'Kaydet',true);
  mfRender();
}
function mfRender(){
  const box=document.getElementById('mfList'); if(!box)return;
  const m=musteri(mfCid); const isk=m&&m.iskonto?m.iskonto:0;
  const list=DB.urunler.filter(u=>u.ad.toLowerCase().includes(mfQ.toLowerCase()));
  box.innerHTML=list.length?list.map(u=>{
    const fb=Math.round(u.satis*(1-isk/100)*100)/100; const cur=mfBuf[u.id];
    return `<div class="mf-row">
      <div class="mf-info"><b>${esc(u.ad)}</b><span>liste ${TL0(u.satis)}${isk?` · iskontolu ${TL0(fb)}`:''}</span></div>
      <input class="mf-in" type="number" inputmode="decimal" value="${cur!=null?cur:''}" placeholder="${Math.round(fb)}" oninput="mfSet('${u.id}',this.value)">
    </div>`;}).join(''):`<div class="empty" style="padding:24px"><b>Ürün bulunamadı</b></div>`;
}
function mfSet(id,v){ const n=parseFloat(v); if(v===''||isNaN(n)) delete mfBuf[id]; else mfBuf[id]=n; }
function mfSave(){
  const cid=mfCid; const toSave=[],toDel=[];
  DB.urunler.forEach(u=>{
    const existing=DB.musteriFiyat.find(x=>x.musteriId===cid&&x.urunId===u.id);
    const v=mfBuf[u.id];
    if(v!=null&&v>0){
      if(existing){ if(existing.fiyat!==v){existing.fiyat=v;toSave.push(existing);} }
      else { const rec={id:uid('mf'),musteriId:cid,urunId:u.id,fiyat:v}; DB.musteriFiyat.push(rec); toSave.push(rec); }
    } else if(existing){ DB.musteriFiyat=DB.musteriFiyat.filter(x=>x.id!==existing.id); toDel.push(existing.id); }
  });
  putMany('musteriFiyat',toSave); toDel.forEach(id=>del('musteriFiyat',id));
  closeModal(); toast('Özel fiyatlar kaydedildi');
}

let onSubmit=null;
function openModal(title,bodyHTML,submit,submitLbl='Kaydet',wide){
  $('#modal').className='modal'+(wide?' wide':'');
  $('#modal').innerHTML=`
    <div class="m-head"><h3>${title}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="m-body">${bodyHTML}</div>
    <div class="m-foot"><button class="btn btn-ghost" onclick="closeModal()">Vazgeç</button><button class="btn btn-primary" onclick="submitModal()">${submitLbl}</button></div>`;
  onSubmit=submit;
  $('#overlay').classList.add('show');
}
function closeModal(){ $('#overlay').classList.remove('show'); onSubmit=null; }
function submitModal(){ if(onSubmit)onSubmit(); }
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
const numv=id=>{const e=document.getElementById(id);return e?parseFloat(e.value)||0:0;};
function field(id,label,type='text',v='',opts){
  if(type==='select')return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(o=>`<option value="${o}"${o===v?' selected':''}>${o}</option>`).join('')}</select></div>`;
  if(type==='textarea')return `<div class="field full"><label>${label}</label><textarea id="${id}" rows="2">${esc(v)}</textarea></div>`;
  return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(v)}"></div>`;
}
function toast(msg){ const t=$('#toast'); t.innerHTML=svg(I.check,17)+esc(msg); t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

/* ============================================================
   BARKOD TARAMA & HIZLI MAL KABUL
============================================================ */
let scanStream=null,scanActive=false,scanContinuous=false,scanReader=null,scanDetector=null,scanRAF=null,scanOnCode=null;
let intakeMode=false,intakeLog=[],pendingCode=null,pendingProduct=null;

function ensureZXing(){return new Promise((res,rej)=>{if(window.ZXing)return res();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=()=>res();s.onerror=()=>rej();document.head.appendChild(s);});}

async function openScanner(title,onCode,continuous){
  scanOnCode=onCode; scanContinuous=!!continuous; scanActive=true;
  document.getElementById('scanTitle').textContent=title||'Barkod tara';
  document.getElementById('scanHint').textContent='Barkodu çerçeveye getirin';
  document.getElementById('scanSheet').classList.remove('show');
  document.getElementById('scanOv').classList.add('show');
  const video=document.getElementById('scanVideo');
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    video.srcObject=scanStream; await video.play();
  }catch(e){ closeScanner(); manualEntryPrompt(onCode,continuous); return; }
  if('BarcodeDetector' in window){
    try{scanDetector=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar']});}
    catch(_){try{scanDetector=new window.BarcodeDetector();}catch(__){scanDetector=null;}}
    if(scanDetector){startDetectLoop();return;}
  }
  try{await ensureZXing();}catch(_){}
  if(window.ZXing){
    scanReader=new ZXing.BrowserMultiFormatReader();
    try{scanReader.decodeFromStream(scanStream,video,(result)=>{if(result&&scanActive)onDetected(result.getText());});}
    catch(_){document.getElementById('scanHint').textContent='Tarama başlatılamadı — barkodu elle girin';}
  }else{
    document.getElementById('scanHint').textContent='Bu cihazda otomatik tarama yok — barkodu elle girin';
  }
}
function startDetectLoop(){
  const video=document.getElementById('scanVideo');
  const loop=async()=>{
    if(!scanActive||!scanDetector)return;
    try{const codes=await scanDetector.detect(video);if(codes&&codes.length){onDetected(codes[0].rawValue);return;}}catch(_){}
    scanRAF=requestAnimationFrame(loop);
  };
  scanRAF=requestAnimationFrame(loop);
}
function onDetected(code){
  if(!scanActive)return; scanActive=false;
  if(navigator.vibrate){try{navigator.vibrate(55);}catch(_){}}
  code=String(code).trim();
  if(scanContinuous){ showIntakeSheet(code); }
  else{
    stopCamera(); document.getElementById('scanOv').classList.remove('show');
    const cb=scanOnCode; scanOnCode=null; if(cb)cb(code);
  }
}
function stopCamera(){
  if(scanRAF){cancelAnimationFrame(scanRAF);scanRAF=null;}
  if(scanReader){try{scanReader.reset();}catch(_){}scanReader=null;}
  scanDetector=null;
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}
}
function closeScanner(){scanActive=false;stopCamera();document.getElementById('scanOv').classList.remove('show');document.getElementById('scanSheet').classList.remove('show');scanOnCode=null;}
function manualEntry(){const cb=scanOnCode,cont=scanContinuous;closeScanner();manualEntryPrompt(cb,cont);}
function manualEntryPrompt(onCode,continuous){
  openModal('Barkodu elle gir',`<div class="form-grid"><div class="field full"><label>Barkod numarası</label><input id="mb_code" type="text" inputmode="numeric" placeholder="Örn. 8690000000000"></div><div class="field full"><span class="hint">Kamerayla okutamıyorsanız numarayı yazın.</span></div></div>`,()=>{
    const c=val('mb_code'); if(!c)return toast('Barkod girin'); closeModal();
    if(continuous){ intakeMode=true; showIntakeSheetModal(c); } else if(onCode){ onCode(c); }
  },'Devam');
}

function startIntake(){intakeMode=true;intakeLog=[];openScanner('Hızlı mal kabul',null,true);}
function showIntakeSheet(code){const sheet=document.getElementById('scanSheet');sheet.innerHTML=intakeSheetHTML(code);sheet.classList.add('show');}
function intakeSheetHTML(code){
  const u=DB.urunler.find(x=>(x.barkod||'')===code); pendingCode=code; pendingProduct=u||null;
  const qty=`<div class="big-qty"><button type="button" onclick="bump(-1)">−</button><input id="ikQty" type="number" value="1" inputmode="numeric"><button type="button" onclick="bump(1)">+</button></div>`;
  if(u){
    return `<div class="sheet-name">${esc(u.ad)} <span class="t-sub">· stok ${NUM(u.stok)} ${u.birim}</span></div>${qty}
      <div class="sheet-btns"><button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="intakeSkip()">Farklı ürün</button><button class="btn btn-primary" style="flex:1;justify-content:center" onclick="intakeAdd()">Ekle & devam</button></div>
      <button class="btn btn-ghost" style="width:100%;margin-top:10px;justify-content:center" onclick="finishIntake()">Bitir (${intakeLog.length} kalem)</button>`;
  }
  return `<div class="sheet-name">Yeni barkod</div><div class="t-sub" style="margin:2px 0 6px"><span class="mono-n">${esc(code)}</span> — hangi ürün?</div>
    <select class="sheet-select" id="ikSel"><option value="">Ürün seç...</option>${DB.urunler.map(p=>`<option value="${p.id}">${esc(p.ad)}</option>`).join('')}</select>${qty}
    <div class="sheet-btns"><button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="intakeSkip()">Atla</button><button class="btn btn-primary" style="flex:1;justify-content:center" onclick="intakeAddNew()">Eşleştir & devam</button></div>
    <button class="btn btn-ghost" style="width:100%;margin-top:10px;justify-content:center" onclick="finishIntake()">Bitir (${intakeLog.length} kalem)</button>`;
}
function bump(d){const q=document.getElementById('ikQty');if(q)q.value=Math.max(1,(parseInt(q.value)||1)+d);}
function intakeAdd(){const q=parseInt((document.getElementById('ikQty')||{}).value)||1;applyIntake(pendingProduct,q);sheetResume();}
function intakeAddNew(){const id=(document.getElementById('ikSel')||{}).value;if(!id)return toast('Ürün seçin');const u=urun(id);u.barkod=pendingCode;const q=parseInt((document.getElementById('ikQty')||{}).value)||1;applyIntake(u,q);sheetResume();}
function intakeSkip(){sheetResume();}
function applyIntake(u,q){u.stok+=q;const h={id:uid('h'),tarih:new Date().toISOString(),urunId:u.id,ad:u.ad,tip:'giris',miktar:q,aciklama:'Hızlı mal kabul'};DB.stokHar.push(h);intakeLog.push({ad:u.ad,q,birim:u.birim});put('urunler',u);put('stokHar',h);toast(u.ad+' +'+NUM(q));}
function sheetResume(){document.getElementById('scanSheet').classList.remove('show');pendingProduct=null;pendingCode=null;scanActive=true;if(scanDetector)startDetectLoop();}
function showIntakeSheetModal(code){
  const u=DB.urunler.find(x=>(x.barkod||'')===code); pendingCode=code; pendingProduct=u||null;
  const body=`<div class="form-grid">
    ${u?`<div class="field full"><span class="hint"><b>${esc(u.ad)}</b> · stok ${NUM(u.stok)} ${u.birim}</span></div>`
       :`<div class="field full"><label>Barkod ${esc(code)} — ürün seç</label><select id="ik_sel"><option value="">Seç...</option>${DB.urunler.map(p=>`<option value="${p.id}">${esc(p.ad)}</option>`).join('')}</select></div>`}
    <div class="field full"><label>Gelen miktar</label><input id="ik_qty" type="number" value="1" inputmode="numeric"></div>
  </div>`;
  openModal('Mal kabul',body,()=>{
    let u2=pendingProduct; if(!u2){const id=val('ik_sel');if(!id)return toast('Ürün seçin');u2=urun(id);u2.barkod=code;}
    const q=parseInt(val('ik_qty'))||1; applyIntake(u2,q); finishIntake();
  },'Ekle');
}
function finishIntake(){
  intakeMode=false; closeScanner();
  const n=intakeLog.reduce((a,x)=>a+x.q,0); viewStok();
  if(intakeLog.length){openModal('Mal kabul özeti',`<div class="alist">${intakeLog.map(x=>`<div class="intake-item"><b>${esc(x.ad)}</b><span class="intake-badge">+${NUM(x.q)} ${x.birim}</span></div>`).join('')}</div><div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-weight:800"><span>Toplam</span><span>${intakeLog.length} kalem · ${NUM(n)} adet</span></div>`,()=>closeModal(),'Tamam');}
}

/* ============================================================
   TEMA (gece / aydınlık — varsayılan: cihaz ayarı)
============================================================ */
function currentTheme(){ return document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light'; }
function updateThemeBtn(t){ const b=document.getElementById('themeBtn'); if(b)b.innerHTML=svg(t==='dark'?I.sun:I.moon,16); }
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); updateThemeBtn(t); }
function toggleTheme(){ const t=currentTheme()==='dark'?'light':'dark'; try{localStorage.setItem('panel_theme',t);}catch(e){} applyTheme(t); }
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{ try{if(localStorage.getItem('panel_theme'))return;}catch(_){ } applyTheme(e.matches?'dark':'light'); }); }catch(e){}

/* ============================================================
   INIT
============================================================ */
$('#today').textContent=new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
updateThemeBtn(currentTheme());
initAuth();
</script>
